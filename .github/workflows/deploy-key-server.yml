name: Deploy key server

on:
  workflow_dispatch:
    inputs:
      lootlabs_url:
        description: URL publica HTTPS do link LootLabs
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: key-server-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate API and deployment input
        env:
          LOOTLABS_URL: ${{ inputs.lootlabs_url }}
        run: |
          node --test key-server/test/*.test.mjs
          node --check key-server/src/index.js
          node --input-type=module -e '
            const value = process.env.LOOTLABS_URL || "";
            let url;
            try { url = new URL(value); } catch {}
            if (!url || url.protocol !== "https:" || url.username || url.password || /REPLACE/i.test(value)) {
              console.error("Informe uma URL publica HTTPS valida do LootLabs.");
              process.exit(1);
            }
          '

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          LOOTLABS_URL: ${{ inputs.lootlabs_url }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: key-server
          packageManager: pnpm
          wranglerVersion: 4.123.0
          command: deploy
          vars: LOOTLABS_URL
