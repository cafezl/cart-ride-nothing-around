name: Deploy key server

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-key-server.yml
      - key-server/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: key-server-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install key server dependencies
        working-directory: key-server
        run: pnpm install --frozen-lockfile
      - name: Validate API and production bundle
        run: |
          node --test key-server/test/*.test.mjs
          pnpm --dir key-server run check
          pnpm --dir key-server exec wrangler deploy --dry-run

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install key server dependencies
        working-directory: key-server
        run: pnpm install --frozen-lockfile
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: key-server
          packageManager: pnpm
          wranglerVersion: 4.123.0
          command: deploy
      - name: Verify production health and provider sessions
        working-directory: key-server
        env:
          KEY_SERVER_ORIGIN: https://nothrilo-key.urielcafe01.workers.dev
        run: pnpm run smoke:production
